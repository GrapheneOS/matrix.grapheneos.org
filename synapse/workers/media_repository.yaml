worker_app: synapse.app.media_repository
worker_name: media_repository

worker_listeners:
  - path: /run/synapse/media_repository_public.sock
    mode: 0660
    type: http
    resources:
      - names: [media]
  - path: /run/synapse/media_repository_replication.sock
    mode: 0600
    type: http
    resources:
      - names: [replication]

worker_log_config: /etc/synapse/workers/media_repository_log_config.yaml
